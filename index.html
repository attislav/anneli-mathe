<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annelis Mathe-Spass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login Screen -->
  <div class="login-screen" id="login-screen">
    <div class="login-container">
      <img src="titelbild.png" alt="Annelis Mathe-Spass" class="title-image">
      <div class="login-box">
        <h2>Wer bist du?</h2>

        <!-- Existing profiles on this device -->
        <div class="profile-list" id="profile-list"></div>

        <!-- Login with existing name (cross-device) -->
        <div class="login-existing">
          <p class="new-profile-label">Mit bestehendem Namen einloggen:</p>
          <div class="login-input-row">
            <input type="text" id="login-name-input" class="login-input" placeholder="z.B. SchlauFuchs42" autocomplete="off">
            <button class="btn-login-go" id="btn-login-existing">Einloggen</button>
          </div>
          <p class="login-hint" id="login-hint"></p>
        </div>

        <div class="login-divider"><span>oder</span></div>

        <!-- New profile creation -->
        <div class="new-profile" id="new-profile-section">
          <p class="new-profile-label">Neues Profil erstellen:</p>
          <div class="generated-name" id="generated-name"></div>
          <button class="btn-reroll" id="btn-reroll">&#x1F3B2; Neuer Name</button>
          <button class="btn-login" id="btn-create-profile">Los geht's!</button>
        </div>

        <div class="login-divider"><span>Fortschritt mitnehmen</span></div>

        <!-- Import/Export -->
        <div class="transfer-section">
          <button class="btn-transfer" id="btn-import">&#128229; Fortschritt importieren</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container hidden" id="app-container">
    <div class="profile-bar">
      <img src="titelbild.png" alt="Annelis Mathe-Spass" class="title-image">
      <button class="btn-profile-switch" id="btn-switch-profile">&#x1F464; Profil wechseln</button>
      <button class="btn-profile-export" id="btn-export">&#128228; Fortschritt sichern</button>
    </div>

    <!-- Gamification Bar: Stars, Level, Streak, Achievements -->
    <div class="gamification-bar">
      <div class="star-display" id="star-display">
        <span class="star-icon">&#11088;</span>
        <span id="star-count">0</span>
      </div>

      <div class="level-display" id="level-display">
        <div class="level-info">
          <span class="level-mascot" id="level-mascot">🐣</span>
          <span class="level-name" id="level-name">Mathe-Anfänger</span>
        </div>
        <div class="xp-bar">
          <div class="xp-fill" id="xp-fill" style="width: 0%"></div>
        </div>
        <span class="xp-text" id="xp-text">0 / 20 XP</span>
      </div>

      <div class="streak-display hidden" id="streak-display">
        <span class="streak-flame">🔥</span>
        <span class="streak-count" id="streak-count">0</span>
        <span class="streak-label">Streak!</span>
      </div>
    </div>

    <button class="btn-achievements" id="btn-achievements">🏆 Abzeichen</button>
    <button class="btn-parent" id="btn-parent">👨‍👩‍👧 Eltern-Ansicht</button>

    <!-- Achievements Modal -->
    <div class="modal-overlay hidden" id="achievements-modal">
      <div class="modal">
        <div class="modal-header">
          <h2>🏆 Meine Abzeichen</h2>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div class="achievements-grid" id="achievements-grid"></div>
      </div>
    </div>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
      <button class="btn-mode active" id="btn-mode-path">Lernpfad</button>
      <button class="btn-mode" id="btn-mode-free">Freies &Uuml;ben</button>
    </div>

    <!-- Learning Path -->
    <div id="learning-path">
      <div class="path-container" id="path-stages"></div>
      <div class="path-hint" id="path-hint"></div>
    </div>

    <!-- Free Practice Settings (hidden in Lernpfad mode) -->
    <div class="settings hidden" id="settings-panel">
      <div class="setting-group">
        <label>Schwierigkeit:</label>
        <div class="button-group" id="difficulty">
          <button class="btn-setting active" data-value="leicht">Leicht</button>
          <button class="btn-setting" data-value="mittel">Mittel</button>
          <button class="btn-setting" data-value="schwer">Schwer</button>
        </div>
      </div>

      <div class="setting-group">
        <label>Rechenart:</label>
        <div class="button-group" id="operation">
          <button class="btn-setting active" data-value="gemischt">Gemischt</button>
          <button class="btn-setting" data-value="plus">Nur Plus</button>
          <button class="btn-setting" data-value="minus">Nur Minus</button>
          <button class="btn-setting" data-value="luecken">L&#252;cken</button>
          <button class="btn-setting" data-value="zehner">Zehnerzerlegung</button>
          <button class="btn-setting" data-value="vergleichen">Vergleichen</button>
          <button class="btn-setting" data-value="verdoppeln">Verdoppeln</button>
          <button class="btn-setting" data-value="nachbarn">Nachbarzahlen</button>
          <button class="btn-setting" data-value="reihen">Zahlenreihen</button>
        </div>
      </div>
    </div>

    <!-- Exercise Area (separate view from map in Lernpfad mode) -->
    <div id="exercise-area" class="hidden">
      <button class="btn-back-to-map" id="btn-back-to-map">&larr; Zur&uuml;ck zur Karte</button>
      <div class="stage-header" id="stage-header"></div>

      <!-- Adaptive Suggestion -->
      <div class="adaptive-suggestion hidden" id="adaptive-suggestion"></div>

      <button class="btn-new" id="btn-generate">Neue Aufgaben</button>

      <div id="exercises"></div>

      <div id="actions" class="hidden">
        <button class="btn-check" id="btn-check">Antworten pr&#252;fen</button>
      </div>

      <div id="result-summary" class="hidden"></div>
    </div>
  </div> <!-- /app-container -->

  <script src="script.js"></script>
</body>
</html>
